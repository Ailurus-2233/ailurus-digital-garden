services:
  web:
    image: localhost/node-pnpm:latest
    container_name: my-blog
    working_dir: /app
    command: sh -c "pnpm install && pnpm run docs:dev"
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai  
      - CHOKIDAR_USEPOLLING=true   # 保证文件变更能被监听到
      - WATCHPACK_POLLING=true     # 针对 webpack/vite 项目
